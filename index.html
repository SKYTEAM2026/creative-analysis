<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소재 성과분석 · 써마드</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--card2:#1e222b;--bd:#2a2f3a;--tx:#e6e8ec;--tx2:#9aa2b1;
        --good:#2ecc71;--bad:#e74c3c;--mid:#f1c40f;--meta:#1877f2;--tiktok:#fe2c55;--google:#34a853;--accent:#7c9cff;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:'Pretendard',-apple-system,'Segoe UI',sans-serif;font-size:14px}
  .wrap{max-width:1180px;margin:0 auto;padding:20px}
  h1{font-size:20px;margin:0 0 2px} .sub{color:var(--tx2);font-size:13px;margin-bottom:16px}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;min-width:120px}
  .kpi .v{font-size:19px;font-weight:700} .kpi .l{color:var(--tx2);font-size:12px}
  .patterns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
  @media(max-width:720px){.patterns{grid-template-columns:1fr}}
  .pbox{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
  .pbox h3{margin:0 0 8px;font-size:14px} .pbox.win h3{color:var(--good)} .pbox.lose h3{color:var(--bad)}
  .pbox ul{margin:0;padding-left:18px;color:var(--tx2);line-height:1.7}
  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bd);font-size:13px}
  th{color:var(--tx2);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
  tr.row{cursor:pointer} tr.row:hover{background:var(--card2)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .roas{font-weight:700;border-radius:6px;padding:2px 7px}
  .badge{display:inline-block;font-size:10px;font-weight:700;border-radius:5px;padding:1px 5px;margin-right:3px;color:#fff}
  .b-meta{background:var(--meta)}.b-tiktok{background:var(--tiktok)}.b-google{background:var(--google)}
  .oneliner{color:var(--tx2);font-size:12.5px;max-width:420px}
  .detail{background:var(--card2)!important}
  .detail td{padding:0}
  .dwrap{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px}
  @media(max-width:720px){.dwrap{grid-template-columns:1fr}}
  .frames{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .frames img{width:100%;border-radius:8px;border:1px solid var(--bd)}
  .tags{display:flex;flex-direction:column;gap:10px}
  .tg{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
  .tg h4{margin:0 0 6px;font-size:12px;color:var(--accent)}
  .tg .kv{display:flex;gap:6px;font-size:12.5px;margin:3px 0} .tg .kv b{color:var(--tx2);min-width:76px;flex:none}
  .chip{display:inline-block;background:#242a36;border:1px solid var(--bd);border-radius:999px;padding:2px 9px;margin:2px 3px 0 0;font-size:12px}
  .ol{background:linear-gradient(90deg,#1c2331,#171a21);border-left:3px solid var(--accent);padding:11px 13px;border-radius:8px;font-size:13.5px;line-height:1.6}
  .script{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;max-height:220px;overflow:auto;font-size:12px;color:var(--tx2);line-height:1.7}
  .empty{color:var(--tx2);padding:40px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>소재 성과분석 · <span id="prod">써마드</span></h1>
  <div id="prodTabs" style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px"></div>
  <div id="rangeTabs" style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px"></div>
  <div class="sub" id="sub">불러오는 중…</div>
  <div id="criteria" style="font-size:12px;color:var(--tx2);background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--accent);border-radius:8px;padding:9px 12px;margin:0 0 12px;line-height:1.55"></div>
  <div id="viewTabs" style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px"></div>
  <div class="kpis" id="kpis"></div>
  <div class="patterns" id="patterns"></div>
  <table id="tbl"><thead><tr>
    <th data-k="rank">#</th><th data-k="key">소재</th><th data-k="platforms">플랫폼</th>
    <th data-k="roas" class="num">ROAS</th><th data-k="spend" class="num">지출</th>
    <th data-k="hook">훅타입</th><th data-k="angle">소구앵글</th><th data-k="one">한줄평</th>
  </tr></thead><tbody id="tb"><tr><td colspan="8" class="empty">데이터 로딩…</td></tr></tbody></table>
  <div class="sub" style="margin-top:14px">행을 클릭하면 프레임·태그·대사·한줄평 상세가 열립니다.</div>
</div>
<script>
const fCur=n=>n==null?'–':'₩'+Math.round(n).toLocaleString();
const roasColor=r=>(r==null?'#555':(r>=2?'var(--good)':'var(--bad)'));
function badges(pl){return (pl||[]).map(p=>`<span class="badge b-${p}">${{google:'G',tiktok:'TT',meta:'M'}[p]||p}</span>`).join('')}
let DATA=null, curView='overall';
const VIEWS=[['overall','통합'],['meta','메타'],['tiktok','틱톡'],['google','구글']];
const vRoas=c=>curView==='overall'?c.roas:(c.platform_metrics&&c.platform_metrics[curView]?c.platform_metrics[curView].roas:null);
const vSpend=c=>curView==='overall'?c.spend:(c.platform_metrics&&c.platform_metrics[curView]?c.platform_metrics[curView].spend:0);
const vCtr=c=>curView==='overall'?c.ctr:(c.platform_metrics&&c.platform_metrics[curView]?c.platform_metrics[curView].ctr:null);
const inView=c=>curView==='overall'?true:(c.platform_metrics&&c.platform_metrics[curView]&&(c.platform_metrics[curView].spend||0)>=500000&&c.platform_metrics[curView].roas!=null);
const vScore=c=>{const r=vRoas(c),s=vSpend(c);return (r==null||!s||s<=0)?-1:r*Math.sqrt(s);};  // 지출 가중 ROAS

function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function chips(arr){return (arr||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}

const PLN={meta:'메타',tiktok:'틱톡',google:'구글'};
function pmBlock(c){
  const pm=c.platform_metrics||{}; const rows=Object.keys(pm).filter(k=>pm[k]&&pm[k].spend);
  if(!rows.length)return '';
  const cells=rows.map(k=>{const m=pm[k];return `<div style="flex:1;min-width:96px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 9px">
    <div style="font-size:11px;color:var(--tx2)">${PLN[k]||k}</div>
    <div style="font-size:15px;font-weight:700;color:${roasColor(m.roas)}">${m.roas??'–'}</div>
    <div style="font-size:11px;color:var(--tx2)">${fCur(m.spend)}</div></div>`}).join('');
  return `<div style="display:flex;gap:6px;flex-wrap:wrap">${cells}</div>`;
}
function kv(label,val){return val?`<div class="kv"><b>${label}</b><span>${esc(val)}</span></div>`:''}
function tagBlock(title,obj,rows){return `<div class="tg"><h4>${title}</h4>${rows.map(([l,k])=>kv(l,obj?.[k])).join('')}</div>`}

function detailHTML(c){
  const framesDir=`analysis/${c.key}/`;
  const imgs=(c.frames||[]).map(f=>`<img loading="lazy" src="${framesDir}${f}" onerror="this.style.display='none'">`).join('');
  return `<div class="dwrap">
    <div>
      <div class="frames">${imgs||'<div class="empty">프레임 없음</div>'}</div>
      <div class="script" style="margin-top:10px"><b style="color:var(--tx)">대사</b><br>${esc(c.transcript||'—')}</div>
    </div>
    <div class="tags">
      <div class="ol">💬 ${esc(c.one_liner||'—')}</div>
      ${pmBlock(c)}
      ${tagBlock('🎙 오디오·나레이션 훅',c.audio,[['오프닝','opening_line'],['목소리','voice_style'],['나레이션','narration_mode']])}
      ${tagBlock('🎬 연출·비주얼',c.visual,[['포맷','format'],['메커니즘','mechanism_viz'],['비포애프터','before_after'],['자막','subtitle_style']])}
      ${tagBlock('🎯 타겟·소구',c.target,[['성별','gender'],['연령','age'],['세그먼트','segment'],['소구축','appeal_axis']])}
      ${tagBlock('🛡 신뢰·오퍼',c.trust,[['근거','evidence'],['환불','refund'],['할인','discount'],['컴플라','compliance']])}
      <div class="tg"><h4>🔑 기본</h4>
        ${kv('훅타입',c.base?.hook_type)}${kv('초반3초',c.base?.first_3s)}${kv('소구앵글',c.base?.appeal_angle)}${kv('CTA',c.base?.cta)}
        <div class="kv"><b>키워드</b><span>${chips(c.base?.keywords)}</span></div>
      </div>
      ${c.why?`<div class="tg"><h4>📌 성패 가설</h4><div style="font-size:12.5px;line-height:1.6;color:var(--tx2)">${esc(c.why)}</div></div>`:''}
    </div>
  </div>`;
}

const TOPN=10;
function render(){
  const pool=DATA.creatives.filter(inView);
  // 🏆상위 = 지출가중 ROAS 상위 / 📉하위 = 순수 ROAS 최저(고ROAS는 하위 제외)
  const tops=[...pool].sort((a,b)=>vScore(b)-vScore(a)).slice(0,TOPN);
  const topKeys=new Set(tops.map(c=>c.key));
  const botSel=pool.filter(c=>!topKeys.has(c.key)&&vRoas(c)!=null).sort((a,b)=>vRoas(a)-vRoas(b)).slice(0,TOPN);
  const bots=[...botSel].sort((a,b)=>vRoas(b)-vRoas(a));
  const omitted=Math.max(0,pool.length-tops.length-bots.length);
  const avg=arr=>arr.length?(arr.reduce((s,c)=>s+(vRoas(c)||0),0)/arr.length).toFixed(2):'–';
  const viewLabel=(VIEWS.find(v=>v[0]===curView)||[])[1]||'';
  document.getElementById('kpis').innerHTML=Object.entries({
    ['상위/하위']:tops.length+' / '+bots.length,'평균 ROAS(상위)':avg(tops),'평균 ROAS(하위)':avg(bots),
    ['지출('+viewLabel+')']:fCur([...tops,...bots].reduce((s,c)=>s+(vSpend(c)||0),0))
  }).map(([l,v])=>`<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
  const tb=document.getElementById('tb'); tb.innerHTML='';
  if(!sorted.length){tb.innerHTML='<tr><td colspan="8" class="empty">이 매체에 유의미 지출(50만↑) 소재가 없습니다</td></tr>';return}
  const addRow=(c,rank,isTop)=>{
    const r=vRoas(c);
    const tr=document.createElement('tr'); tr.className='row';
    tr.style.borderLeft=`4px solid ${isTop?'var(--good)':'var(--bad)'}`;
    tr.style.background=isTop?'rgba(46,204,113,0.05)':'rgba(231,76,60,0.05)';
    tr.innerHTML=`<td class="num">${rank}</td>
      <td><b>${esc(c.key)}</b>${c.analyzed?'':' <span style="color:#e0a63a;font-size:11px">· 분석대기</span>'}</td>
      <td>${badges(c.platforms)}</td>
      <td class="num"><span class="roas" style="background:${roasColor(r)};color:#0b0d10">${r??'–'}</span></td>
      <td class="num">${fCur(vSpend(c))}</td>
      <td>${esc(c.base?.hook_type||'–')}</td>
      <td>${esc(c.base?.appeal_angle||'–')}</td>
      <td class="oneliner">${esc((c.one_liner||'').slice(0,70))}${(c.one_liner||'').length>70?'…':''}</td>`;
    const det=document.createElement('tr'); det.className='detail'; det.style.display='none';
    det.innerHTML=`<td colspan="8">${detailHTML(c)}</td>`;
    tr.onclick=()=>{det.style.display=det.style.display==='none'?'':'none'};
    tb.appendChild(tr); tb.appendChild(det);
  };
  const sectionRow=(label,color,sub)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td colspan="8" style="background:${color};color:#0b0d10;font-weight:800;font-size:13px;padding:8px 12px;letter-spacing:.5px">${label} <span style="font-weight:600;opacity:.75">${sub||''}</span></td>`;
    tb.appendChild(tr);
  };
  const avgLbl=arr=>arr.length?`평균 ROAS ${avg(arr)}`:'';
  sectionRow(`🏆 상위 소재 ${tops.length}개`, 'var(--good)', avgLbl(tops));
  tops.forEach((c,i)=>addRow(c,i+1,true));
  sectionRow(`📉 하위 소재 ${bots.length}개`, 'var(--bad)', (omitted>0?`· 중간 ${omitted}개 생략 · `:'')+avgLbl(bots));
  bots.forEach((c,i)=>addRow(c,sorted.length-bots.length+i+1,false));
}
function buildViewTabs(){
  const el=document.getElementById('viewTabs');
  el.innerHTML=VIEWS.map(([k,l])=>`<button class="vtab" data-v="${k}" style="padding:4px 12px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:12.5px;font-weight:600">${l}</button>`).join('');
  el.querySelectorAll('.vtab').forEach(b=>b.onclick=()=>{
    curView=b.dataset.v;
    el.querySelectorAll('.vtab').forEach(x=>{x.style.borderColor='var(--bd)';x.style.color='var(--tx)'});
    b.style.borderColor='var(--accent)';b.style.color='var(--accent)';
    render();
  });
  el.querySelector('.vtab').style.borderColor='var(--accent)';el.querySelector('.vtab').style.color='var(--accent)';
}

function boot(d){
  DATA=d; curView='overall';
  document.getElementById('prod').textContent=d.product||'써마드';
  const rangeLbl={last_30d:'최근 30일',last_7d:'최근 7일'}[d.range]||d.range||'';
  document.getElementById('sub').innerHTML=`📅 <b>${rangeLbl}</b> 기준 · 최종 업데이트 <b>${d.generated||'—'}</b> · <span style="color:var(--accent)">매주 월요일 자동 갱신</span> · 소재 ${d.creatives.length}개`;
  document.getElementById('criteria').innerHTML=`<b>📌 선정 기준</b> ${esc(d.criteria||'')}`;
  const P=d.patterns||{};
  document.getElementById('patterns').innerHTML=`
    <div class="pbox win"><h3>✅ 성공 패턴</h3><ul>${(P.win||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="pbox lose"><h3>📉 실패 패턴</h3><ul>${(P.lose||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  buildViewTabs();
  render();
}

let PRODUCTS=[], curProd=0, curRange='last_30d';
const RANGELBL={last_14d:'최근 2주',last_30d:'최근 한달'};
function loadCur(){
  const p=PRODUCTS[curProd]; if(!p)return;
  if(!p.files[curRange]) curRange=p.ranges[p.ranges.length-1];  // 해당 기간 없으면 마지막 기간
  buildRangeTabs();
  fetch('data/'+p.files[curRange]+'?t='+Date.now()).then(r=>r.json()).then(boot)
    .catch(e=>{document.getElementById('sub').textContent='데이터 로드 실패';});
}
function styleTabs(el,active){el.querySelectorAll('button').forEach(x=>{x.style.borderColor='var(--bd)';x.style.color='var(--tx)'});if(active){active.style.borderColor='var(--accent)';active.style.color='var(--accent)';}}
function buildProdTabs(){
  const el=document.getElementById('prodTabs');
  el.innerHTML=PRODUCTS.map((p,i)=>{const c=p.counts[curRange]||p.counts[p.ranges[p.ranges.length-1]]||{};return `<button style="padding:5px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:13px;font-weight:600">${p.product}</button>`}).join('');
  [...el.children].forEach((b,i)=>b.onclick=()=>{curProd=i;styleTabs(el,b);loadCur();});
  styleTabs(el,el.children[curProd]);
}
function buildRangeTabs(){
  const el=document.getElementById('rangeTabs'), p=PRODUCTS[curProd];
  el.innerHTML=p.ranges.map(r=>`<button data-r="${r}" style="padding:4px 12px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:12.5px;font-weight:600">${RANGELBL[r]||r}</button>`).join('');
  [...el.children].forEach(b=>b.onclick=()=>{curRange=b.dataset.r;styleTabs(el,b);loadCur();});
  styleTabs(el,[...el.children].find(b=>b.dataset.r===curRange));
}
fetch('data/products.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  PRODUCTS=d.products;
  buildProdTabs();
  loadCur();
}).catch(e=>{document.getElementById('sub').textContent='products.json 로드 실패';});
</script>
</body>
</html>
